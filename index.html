<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine's Day</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="css/floating-hearts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div
        id="section-1"
        class="content"
        data-aos="fade"
        data-aos-duration="800"
      >
        <h6 id="friend_name">
          <span class="handwrite"></span>
        </h6>
      </div>
      <div class="content" data-aos="fade-up" data-aos-duration="800">
        <div class="visuals" data-aos="zoom-in" data-aos-delay="600">
          <p>Hoy es un día especial para celebrar la amistad</p>
        </div>
      </div>
      <div
        id="section-2"
        class="content"
        data-aos="fade-up"
        data-aos-duration="800"
      >
        <div class="visuals-content" data-aos="zoom-in" data-aos-delay="600">
          <span class="visual-heart">❤️</span>
          <span class="visual-flower">🌸</span>
          <span class="visual-star">✨</span>
        </div>
      </div>
      <div
        id="section-3"
        class="content"
        data-aos="fade-up"
        data-aos-duration="800"
      >
        <div
          class="timeline-section gallery-section"
          id="section-moments"
          data-aos="fade-left"
          data-aos-duration="1200"
        >
          <div class="gallery-track">
            <!-- Las imágenes personalizadas se insertarán aquí por JS -->
          </div>
        </div>
      </div>
      <div
        id="section-4"
        class="content"
        data-aos="fade-up"
        data-aos-duration="800"
      >
        <div
          class="timeline-section"
          id="section-message"
          data-aos="fade-right"
          data-aos-duration="1200"
        >
          <div class="final-message"></div>
        </div>
      </div>
    </div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/floating-hearts.js"></script>
    <script src="js/scripts.js"></script>
    <script>
      AOS.init({
        once: true,
        duration: 800,
        easing: "ease-in-out",
        disableMutationObserver: false,
      });
      AOS.refresh();
      document.querySelector(".container").addEventListener("scroll", () => {
        AOS.refresh();
      });
      // Forzar scroll al inicio al cargar
      document.addEventListener("DOMContentLoaded", function () {
        document
          .querySelector(".container")
          .scrollTo({ top: 0, behavior: "auto" });
      });
    </script>
  </body>
</html>
